name: Locana
options:
  bundleIdPrefix: app.locana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LocanaKit:
    path: LocanaKit
targets:
  Locana:
    type: application
    platform: iOS
    sources:
      - path: Locana
    dependencies:
      - package: LocanaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.locana.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Locana/Info.plist
        # Where the app talks to. Override at build time: xcodebuild ... LOCANA_API_URL=https://api.example.com/
        LOCANA_API_URL: "http://localhost:3000/"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Locana/Info.plist
      properties:
        CFBundleDisplayName: Locana
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LocanaAPIURL: "$(LOCANA_API_URL)"
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "Locana shows where you are on the map and shares it with the circles you choose."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Locana keeps sharing your position with your circles and records your places and trips while the app is closed. You can pause it any time."
        NSMotionUsageDescription: "Locana uses the motion sensors to tell driving from walking, and to ask if you are okay after a hard impact."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  LocanaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocanaTests
    dependencies:
      - target: Locana
schemes:
  Locana:
    build:
      targets:
        Locana: all
        LocanaTests: [test]
    test:
      targets:
        - LocanaTests

# Builds and tests the iOS app on a macOS runner. Only runs when something under ios/ changes.
name: iOS

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Runner probe (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - run: echo "ubuntu runners work"
  probe-mac15:
    name: Runner probe (macos-15)
    runs-on: macos-15
    steps:
      - run: sw_vers && swift --version
  kit:
    name: LocanaKit tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version && xcodebuild -version
      - name: Test
        working-directory: ios/LocanaKit
        run: swift test

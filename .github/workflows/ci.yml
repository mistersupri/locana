# Tests and builds every push and pull request. release.yml calls this workflow first,
# so nothing is released unless all of these jobs pass.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: locana
          POSTGRES_PASSWORD: locana
          POSTGRES_DB: locana_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locana -d locana_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://locana:locana@localhost:5432/locana_test?schema=public
      # Prisma needs a URL at generate time; tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://locana:locana@localhost:5432/locana_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (PostgreSQL)
        run: npm run test:e2e
      - name: Build
        run: npm run build

  android:
    name: Android tests and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, Robolectric and Compose tests
        run: ./gradlew --stacktrace :domain:test :app:testDebugUnitTest
      - name: Debug build
        run: ./gradlew :app:assembleDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests
            android/domain/build/reports/tests
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: locana-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  android-e2e:
    name: Full-app click-through against the backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: locana
          POSTGRES_PASSWORD: locana
          POSTGRES_DB: locana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locana -d locana"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://locana:locana@localhost:5432/locana?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start backend
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build
          node dist/scripts/seed.js
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health/ready && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Click through the app
        working-directory: android
        env:
          LOCANA_E2E_API: http://127.0.0.1:3000/
          LOCANA_SHOTS_DIR: ${{ github.workspace }}/screens
        run: ./gradlew --stacktrace :app:testDebugUnitTest --tests 'app.locana.e2e.AppFlowTest'
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screens
          path: screens/*.png
          if-no-files-found: ignore
      - name: Backend log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  docker:
    name: Backend image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

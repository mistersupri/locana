# Push a tag like v0.2.0 to release:
#   1. run the full CI workflow,
#   2. build the signed release APK and App Bundle,
#   3. publish the backend image to GitHub Container Registry,
#   4. create a GitHub Release with the APK, the AAB and their SHA-256 sums.
# Tags with a suffix (v0.2.0-rc.1) become pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  android:
    name: Release APK and App Bundle
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      signing: ${{ steps.keystore.outputs.signing }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "LOCANA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Building a debug-signed APK: installable for testing, not accepted by Google Play."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          LOCANA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOCANA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOCANA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          # Repository variable; the build refuses anything that is not https.
          LOCANA_API_URL_RELEASE: ${{ vars.LOCANA_API_URL_RELEASE }}
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ steps.keystore.outputs.signing }}" = "debug" ]; then extra="-PlocanaDebugSignedRelease=true"; fi
          if [ -z "${LOCANA_API_URL_RELEASE:-}" ]; then
            echo "::warning::Repository variable LOCANA_API_URL_RELEASE is not set; the app will point at https://api.locana.invalid/."
            unset LOCANA_API_URL_RELEASE
          fi
          ./gradlew --stacktrace :app:assembleRelease :app:bundleRelease \
            -PlocanaVersionName="${{ steps.version.outputs.name }}" \
            -PlocanaVersionCode="${{ github.run_number }}" $extra
      - name: Collect artifacts
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.name }}"
          suffix=""
          if [ "${{ steps.keystore.outputs.signing }}" = "debug" ]; then suffix="-debug-signed"; fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/locana-$v$suffix.apk"
          if [ -z "$suffix" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/locana-$v.aab"
          else
            echo "App Bundle skipped: Play only accepts bundles signed with your upload key."
          fi
          cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  backend-image:
    name: Publish backend image
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/locana-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Locana backend
            org.opencontainers.image.description=Auth, circles, live location, places and the Locana game engine
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [android, backend-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - name: Release notes
        run: |
          {
            echo "## Locana ${GITHUB_REF_NAME}"
            echo
            echo "Backend image: \`${{ needs.backend-image.outputs.image }}:${GITHUB_REF_NAME#v}\`"
            echo
            if [ "${{ needs.android.outputs.signing }}" = "debug" ]; then
              echo "**The APK is signed with a debug key.** It installs for testing but Google Play will not accept it."
              echo "Add the ANDROID_KEYSTORE_* secrets (see docs/release.md) to sign with your release key."
            else
              echo "APK and App Bundle are signed with the release key. Upload the .aab to Play Console."
            fi
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS.txt\`."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

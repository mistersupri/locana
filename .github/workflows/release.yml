# Publishes whatever lands on main. Feature work happens on branches cut from main; merging a
# branch into main runs this workflow:
#   1. read the version from the VERSION file at the repository root,
#   2. run the full CI workflow (nothing is published if it fails),
#   3. build the release APK and App Bundle, push the backend image to GitHub Container Registry,
#   4. create the tag v<VERSION> on the main commit and a GitHub Release with the files.
# If the tag already exists the version was not bumped: CI still runs, publishing is skipped.
# A version with a suffix (0.3.0-rc.1) becomes a pre-release and does not move the `latest` image tag.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION must look like 1.2.3 or 1.2.3-rc.1, found '$version'"; exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $tag already exists, so nothing is published. Bump VERSION in the feature branch to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  android:
    name: Release APK and App Bundle
    needs: [prepare, ci]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      signing: ${{ steps.keystore.outputs.signing }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from VERSION file
        id: version
        run: echo "name=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "LOCANA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Building a debug-signed APK: installable for testing, not accepted by Google Play."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          LOCANA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOCANA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOCANA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          # Repository variable; the build refuses anything that is not https.
          LOCANA_API_URL_RELEASE: ${{ vars.LOCANA_API_URL_RELEASE }}
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ steps.keystore.outputs.signing }}" = "debug" ]; then extra="-PlocanaDebugSignedRelease=true"; fi
          if [ -z "${LOCANA_API_URL_RELEASE:-}" ]; then
            echo "::warning::Repository variable LOCANA_API_URL_RELEASE is not set; the app will point at https://api.locana.invalid/."
            unset LOCANA_API_URL_RELEASE
          fi
          ./gradlew --stacktrace :app:assembleRelease :app:bundleRelease \
            -PlocanaVersionName="${{ steps.version.outputs.name }}" \
            -PlocanaVersionCode="${{ github.run_number }}" $extra
      - name: Collect artifacts
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.name }}"
          suffix=""
          if [ "${{ steps.keystore.outputs.signing }}" = "debug" ]; then suffix="-debug-signed"; fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/locana-$v$suffix.apk"
          if [ -z "$suffix" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/locana-$v.aab"
          else
            echo "App Bundle skipped: Play only accepts bundles signed with your upload key."
          fi
          cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  backend-image:
    name: Publish backend image
    needs: [prepare, ci]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/locana-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Locana backend
            org.opencontainers.image.description=Auth, circles, live location, places and the Locana game engine
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [prepare, android, backend-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - name: Release notes
        run: |
          {
            echo "## Locana ${{ needs.prepare.outputs.tag }}"
            echo
            echo "Backend image: \`${{ needs.backend-image.outputs.image }}:${{ needs.prepare.outputs.version }}\`"
            echo
            if [ "${{ needs.android.outputs.signing }}" = "debug" ]; then
              echo "**The APK is signed with a debug key.** It installs for testing but Google Play will not accept it."
              echo "Add the ANDROID_KEYSTORE_* secrets (see docs/release.md) to sign with your release key."
            else
              echo "APK and App Bundle are signed with the release key. Upload the .aab to Play Console."
            fi
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS.txt\`."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
